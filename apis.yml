name: LegalPad
description: 'Legalpad (Legalpad Inc, Seattle) was a startup-focused US work-visa and immigration
  company founded by Todd Heine and Sara Itucas, who first began processing visas together at
  Teleborder (Y Combinator 2013) and reunited in Techstars Seattle in 2017. Legalpad paired
  software with staff immigration attorneys to file O-1, H-1B, L-1, TN, E-1/E-2, E-3 and B-1
  work visas plus EB-1A, EB-1B, EB-1C, EB-2 and EB-2 NIW employment-based green cards, and said
  it had helped 500+ companies at roughly one-third the typical processing time. It raised a $2M
  seed in 2018 and a $10M Series A in 2020 before being acquired by Deel in 2022, after which it
  operated as "Legalpad by Deel" inside Deel Immigration. The legalpad.io web presence was
  retired after 2024 and the business now lives on as Deel Immigration. Legalpad never published
  a public API, developer portal, documentation, SDK or other developer surface, so there is no
  API artifact to enrich.'
